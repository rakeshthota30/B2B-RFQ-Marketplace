{% extends "base.html" %}
{% block title %}Edit RFQ{% endblock %}
{% block content %}
<div class="page-header mb-4">
    <h2 class="fw-bold">Edit RFQ</h2>
    <p class="text-muted">Update your requirement.</p>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Product / Service Name *</label>
                <input type="text" name="product_name" class="form-control" maxlength="150" value="{{ rfq.product_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Requirement Description *</label>
                <textarea name="description" class="form-control" rows="5" required>{{ rfq.description }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Quantity *</label>
                    <input type="number" name="quantity" class="form-control" min="1" value="{{ rfq.quantity }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Delivery Location *</label>
                    <input type="text" name="delivery_location" class="form-control" maxlength="200" value="{{ rfq.delivery_location }}" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">RFQ Deadline *</label>
                <input type="date" name="deadline" class="form-control" value="{{ rfq.deadline.isoformat() }}" required>
            </div>

            <div class="d-flex gap-2">
                <a href="{{ url_for('buyer.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                <button class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
